<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" role="img" aria-label="Albanischer Verein Shqiponja e.V. Wappen">
  <defs>
    <clipPath id="shield-clip">
      <path d="M 26,8 L 494,8 L 494,490 Q 494,575 260,610 Q 26,575 26,490 Z"/>
    </clipPath>
  </defs>

  <!-- Shield outer border -->
  <path d="M 20,4 L 500,4 L 500,492 Q 500,582 260,618 Q 20,582 20,492 Z"
        fill="#111" />
  <!-- Shield white border -->
  <path d="M 30,14 L 490,14 L 490,490 Q 490,572 260,608 Q 30,572 30,490 Z"
        fill="white" />
  <!-- Shield red fill -->
  <path d="M 42,26 L 478,26 L 478,488 Q 478,564 260,598 Q 42,564 42,488 Z"
        fill="#c8102e" />

  <!-- EST. 2013 -->
  <text x="260" y="72" text-anchor="middle"
        font-family="'Arial Narrow','Arial',sans-serif"
        font-size="22" font-weight="700" letter-spacing="4"
        fill="white" opacity="0.9">EST. 2013</text>

  <!-- Main title -->
  <text x="260" y="114" text-anchor="middle"
        font-family="'Arial Black','Arial',sans-serif"
        font-size="34" font-weight="900" letter-spacing="1"
        fill="white">ALBANISCHER VEREIN</text>
  <text x="260" y="152" text-anchor="middle"
        font-family="'Arial Black','Arial',sans-serif"
        font-size="36" font-weight="900" letter-spacing="0"
        fill="white">SHQIPONJA e.V</text>

  <!-- Subtitle -->
  <text x="260" y="180" text-anchor="middle"
        font-family="'Arial Narrow','Arial',sans-serif"
        font-size="16" font-weight="600" letter-spacing="2"
        fill="rgba(255,255,255,0.85)">KLUBI SHQIPTAR SHQIPONJA ÜBERLINGEN</text>

  <!-- Double-headed eagle (Albanian eagle) -->
  <g clip-path="url(#shield-clip)" opacity="0.95">
    <!-- Eagle body -->
    <g fill="#111" transform="translate(260,370) scale(1.15)">
      <!-- Body center -->
      <ellipse cx="0" cy="0" rx="38" ry="55" />
      <!-- Left wing upper -->
      <path d="M -38,-20 Q -120,-80 -175,-30 Q -140,0 -110,10 Q -130,40 -160,70 Q -120,60 -90,40 Q -100,80 -120,110 Q -80,90 -60,60 Q -65,100 -80,130 Q -45,100 -38,70 Q -30,100 -40,130 Q -10,100 -10,60 Z"/>
      <!-- Right wing upper -->
      <path d="M 38,-20 Q 120,-80 175,-30 Q 140,0 110,10 Q 130,40 160,70 Q 120,60 90,40 Q 100,80 120,110 Q 80,90 60,60 Q 65,100 80,130 Q 45,100 38,70 Q 30,100 40,130 Q 10,100 10,60 Z"/>
      <!-- Left leg -->
      <path d="M -15,52 L -25,90 L -15,95 L -20,110 L -10,112 L -8,95 L 0,110 L 5,108 L -2,90 L 5,52 Z"/>
      <!-- Right leg -->
      <path d="M 15,52 L 25,90 L 15,95 L 20,110 L 10,112 L 8,95 L 0,110 L -5,108 L 2,90 L -5,52 Z"/>

      <!-- Left neck -->
      <path d="M -38,-20 Q -55,-60 -45,-90 Q -35,-70 -20,-50 Z"/>
      <!-- Left head -->
      <ellipse cx="-50" cy="-100" rx="22" ry="18" />
      <!-- Left beak top -->
      <path d="M -68,-100 Q -95,-90 -90,-78 Q -75,-82 -68,-88 Z"/>
      <!-- Left beak bottom -->
      <path d="M -68,-100 Q -95,-108 -90,-120 Q -75,-116 -68,-110 Z"/>
      <!-- Left eye -->
      <circle cx="-44" cy="-105" r="5" fill="#c8102e"/>
      <!-- Left crown points -->
      <path d="M -60,-115 L -52,-130 L -44,-113 L -36,-128 L -30,-112 Z" fill="#c8102e"/>

      <!-- Right neck -->
      <path d="M 38,-20 Q 55,-60 45,-90 Q 35,-70 20,-50 Z"/>
      <!-- Right head -->
      <ellipse cx="50" cy="-100" rx="22" ry="18" />
      <!-- Right beak top -->
      <path d="M 68,-100 Q 95,-90 90,-78 Q 75,-82 68,-88 Z"/>
      <!-- Right beak bottom -->
      <path d="M 68,-100 Q 95,-108 90,-120 Q 75,-116 68,-110 Z"/>
      <!-- Right eye -->
      <circle cx="44" cy="-105" r="5" fill="#c8102e"/>
      <!-- Right crown points -->
      <path d="M 60,-115 L 52,-130 L 44,-113 L 36,-128 L 30,-112 Z" fill="#c8102e"/>

      <!-- Albania/Kosovo map silhouette on body (red) -->
      <path d="M -18,-30 Q -10,-40 0,-38 Q 12,-40 18,-28 Q 22,-15 18,0 Q 25,10 20,25 Q 12,35 0,40 Q -12,38 -20,28 Q -26,15 -22,0 Q -24,-12 -18,-30 Z"
            fill="#c8102e" opacity="0.9"/>
    </g>
  </g>

  <!-- German flag at bottom -->
  <g transform="translate(213, 528)">
    <rect x="0" y="0" width="94" height="58" rx="5" fill="white" stroke="#111" stroke-width="3"/>
    <rect x="3" y="3" width="88" height="17" fill="#111"/>
    <rect x="3" y="20" width="88" height="17" fill="#c8102e"/>
    <rect x="3" y="37" width="88" height="18" fill="#FFCC00"/>
  </g>
</svg>
